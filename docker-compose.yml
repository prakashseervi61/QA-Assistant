services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-huggingface}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
      - CHROMA_PERSIST_DIR=/data/chroma
      # Observability — Phoenix tracing (see the `phoenix` service below).
      # Enable by setting ENABLE_TRACING=true; the API reaches Phoenix via
      # the compose service name.
      - ENABLE_TRACING=${ENABLE_TRACING:-false}
      - TRACING_ENDPOINT=${TRACING_ENDPOINT:-http://phoenix:6006/v1/traces}
    volumes:
      - chroma_data:/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
    volumes:
      - phoenix-data:/data

volumes:
  chroma_data:
  phoenix-data:
