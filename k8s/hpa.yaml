# ---------------------------------------------------------------------------
# QA Assistant — HorizontalPodAutoscaler (autoscaling/v2)
#
# Scales the qa-assistant Deployment between 2 and 8 replicas based on CPU
# utilization (70% of the pod's CPU request, i.e. 256m).
# ---------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qa-assistant-hpa
  labels:
    app: qa-assistant
    app.kubernetes.io/name: qa-assistant
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: qa-assistant
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qa-assistant
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Avoid flapping when CPU dips briefly.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
