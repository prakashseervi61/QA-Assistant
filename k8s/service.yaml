# ---------------------------------------------------------------------------
# QA Assistant — ClusterIP Service
#
# Exposes the backend API inside the cluster on port 8000 (the uvicorn port
# declared in the root Dockerfile). The frontend is a separate static
# artifact and is not covered here.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: qa-assistant
  labels:
    app: qa-assistant
    app.kubernetes.io/name: qa-assistant
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: qa-assistant
spec:
  type: ClusterIP
  selector:
    app: qa-assistant
  ports:
    - name: http
      port: 8000          # service port (same as container port here)
      targetPort: http    # named port from the Deployment
      protocol: TCP
