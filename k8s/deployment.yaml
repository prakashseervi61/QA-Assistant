# ---------------------------------------------------------------------------
# QA Assistant — backend API Deployment
#
# Built from the root Dockerfile:
#   - base: python:3.11-slim
#   - CMD: uvicorn src.presentation.api.app:create_app --factory
#          --host 0.0.0.0 --port 8000
#   - EXPOSE 8000
#
# UNVERIFIED: written against a static repo review (no live cluster available).
# See k8s/README.md for the apply order and pre-flight checks.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qa-assistant
  labels:
    app: qa-assistant
    app.kubernetes.io/name: qa-assistant
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: qa-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qa-assistant
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: qa-assistant
        app.kubernetes.io/name: qa-assistant
        app.kubernetes.io/component: backend-api
        app.kubernetes.io/part-of: qa-assistant
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          # TODO: replace with the real image tag pushed to your registry.
          # Build from the repo root:  docker build -t <your-registry>/qa-assistant:<tag> .
          image: your-registry/qa-assistant:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: qa-assistant-config
            - secretRef:
                name: qa-assistant-secrets
          resources:
            requests:
              cpu: 256m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Health route verified in the repo:
          #   src/presentation/api/routes/health.py -> GET /health
          #   mounted under prefix /api in src/presentation/api/app.py
          # The endpoint is deliberately public (no auth required), which
          # makes it safe for probes.
          startupProbe:
            # Optional but recommended: the huggingface embedding model
            # (~80-100 MB) is downloaded on first startup when
            # EMBEDDING_PROVIDER=huggingface, which can take a while.
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            # NOTE: python:3.11-slim runs as root and the Dockerfile does not
            # define a non-root USER, so runAsNonRoot / runAsUser are
            # intentionally omitted here.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # ChromaDB persists to CHROMA_PERSIST_DIR (./data/chroma) at
            # runtime, so the root filesystem cannot be read-only without a
            # writable volume. See k8s/README.md for the volume/state notes.
            readOnlyRootFilesystem: false
