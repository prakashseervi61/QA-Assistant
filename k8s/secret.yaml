# ---------------------------------------------------------------------------
# QA Assistant — Secret TEMPLATE (Opaque)
#
# ⚠️  TEMPLATE ONLY — all values are EMPTY PLACEHOLDERS. Never commit real
# credentials. There are no real values in this repository.
#
# RECOMMENDED: do NOT rely on this file for values at all. Create the secret
# from an untracked env file instead (kubectl >= 1.32 can populate it from
# the YAML, but --from-env-file keeps values out of the repo):
#
#   kubectl create secret generic qa-assistant-secrets \
#     --from-env-file=secrets.env        # untracked, .gitignore it
#
# where secrets.env contains, e.g.:
#   GEMINI_API_KEY=your_gemini_api_key
#   AUTH_API_KEY=your_auth_api_key
#   SECRET_KEY=long-random-hmac-signing-key
#   DATABASE_URL=postgresql+asyncpg://user:password@host:5432/qa_assistant
#
# Required at runtime: at least one LLM provider key (GEMINI_API_KEY,
# OPENAI_API_KEY, ANTHROPIC_API_KEY or DEEPSEEK_API_KEY) — otherwise pods
# start and /api/health passes, but chat/query endpoints will fail.
#
# SECRET_KEY: with ENABLE_AUTH=true the app refuses to start with the bundled
# dev default ("dev-secret-change-me") — always override it here.
#
# stringData values are treated as raw strings by the API server; empty
# values are kept as empty strings.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: qa-assistant-secrets
  labels:
    app: qa-assistant
    app.kubernetes.io/name: qa-assistant
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: qa-assistant
type: Opaque
stringData:
  # LLM provider keys (fill in the provider selected via LLM_PROVIDER)
  GEMINI_API_KEY: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  DEEPSEEK_API_KEY: ""

  # Authentication (only used when ENABLE_AUTH=true)
  SECRET_KEY: ""
  AUTH_API_KEY: ""

  # Optional PostgreSQL DSN (requires ".[postgres]" extra; when unset the
  # app uses in-memory conversation storage — see README scaling notes).
  # Contains credentials, so it belongs in the Secret, not the ConfigMap.
  DATABASE_URL: ""
