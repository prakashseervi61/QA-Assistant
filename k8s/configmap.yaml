# ---------------------------------------------------------------------------
# QA Assistant — ConfigMap (non-secret environment)
#
# Keys match the REAL settings names from the repo:
#   - .env.example
#   - src/infrastructure/config/settings.py (pydantic BaseSettings,
#     case_sensitive=False)
#
# All optional feature flags are explicitly OFF (they default to off in the
# code too). Secrets (API keys, AUTH_API_KEY, SECRET_KEY, DATABASE_URL) live
# in k8s/secret.yaml — never here.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: qa-assistant-config
  labels:
    app: qa-assistant
    app.kubernetes.io/name: qa-assistant
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: qa-assistant
data:
  # --- Application ---
  APP_NAME: "QA Assistant"
  DEBUG: "false"
  LOG_LEVEL: "INFO"

  # --- LLM Provider ---
  # One of: gemini | openai | anthropic | deepseek. The provider API key
  # itself comes from the Secret (GEMINI_API_KEY / OPENAI_API_KEY / ...).
  LLM_PROVIDER: "gemini"
  GEMINI_MODEL: "gemini-2.5-flash"

  # --- Embedding Provider ---
  # huggingface runs locally (no API key), matching the .env.example
  # recommended starting point. The model (~80-100 MB) is downloaded on
  # first startup — see the startupProbe in deployment.yaml.
  EMBEDDING_PROVIDER: "huggingface"
  HUGGINGFACE_MODEL: "all-MiniLM-L6-v2"

  # --- Vector Store (ChromaDB) ---
  # NOTE: this repo uses ChromaDB, not Qdrant — there is no
  # VECTOR_STORE_BACKEND / QDRANT_URL setting.
  # The path is relative to WORKDIR /app in the container. It is NOT
  # persisted across pod restarts unless a volume is mounted — see
  # k8s/README.md ("Stateful notes").
  CHROMA_PERSIST_DIR: "./data/chroma"
  CHROMA_COLLECTION_NAME: "documents"

  # --- Document Processing ---
  CHUNK_SIZE: "1000"
  CHUNK_OVERLAP: "200"

  # --- API ---
  # API_HOST / API_PORT are reserved — uvicorn is launched with explicit
  # host/port in the Dockerfile (0.0.0.0:8000), so they are not set here.
  # CORS_ORIGINS is a JSON list (pydantic-settings parses it). Adjust to the
  # real frontend origin served in front of this API.
  CORS_ORIGINS: '["http://localhost:3000"]'

  # --- Feature toggles (all OFF) ---
  # Authentication
  ENABLE_AUTH: "false"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  # Rate limiting (in-memory per pod — see README)
  ENABLE_RATE_LIMITING: "false"
  RATE_LIMIT_MAX_REQUESTS: "60"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  # Guardrails
  ENABLE_GUARDRAILS: "false"
  GUARDRAIL_BLOCK_VIOLATIONS: "false"
  GUARDRAIL_GROUNDEDNESS_THRESHOLD: "0.2"
  # Incremental ingestion
  ENABLE_INCREMENTAL_INGESTION: "false"
  # Observability / tracing
  ENABLE_TRACING: "false"
  TRACING_SERVICE_NAME: "qa-assistant"
  # Usage tracking — code default is ON (true); set to false here so that
  # "all features off" holds. Re-enable if you want GET /api/usage.
  ENABLE_USAGE_TRACKING: "false"
  # Prompt versioning / A/B
  PROMPT_VERSION: "v1"
  ENABLE_PROMPT_AB_TESTING: "false"

  # --- RAG pipeline options (all OFF by default; uncomment to enable) ---
  # ENABLE_RERANKING: "false"
  # ENABLE_HYBRID_SEARCH: "false"
  # ENABLE_QUERY_REWRITING: "false"
  # ENABLE_PARENT_CHILD: "false"
  # ENABLE_SEMANTIC_CHUNKING: "false"
  # ENABLE_CHUNK_ENRICHMENT: "false"
