# ---------------------------------------------------------------------------
# QA Assistant — Ingress
#
# Routes external HTTP traffic to the backend Service on port 8000.
# The frontend is a separate static artifact and is NOT routed here.
#
# UNVERIFIED: ingressClassName / annotations are assumptions for an
# nginx-ingress setup — adjust to your cluster's controller.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qa-assistant
  labels:
    app: qa-assistant
    app.kubernetes.io/name: qa-assistant
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: qa-assistant
  annotations:
    # Adjust to your ingress controller. Max upload body matches the app's
    # MAX_FILE_SIZE_MB default (50 MB) so document uploads are not rejected
    # by the proxy before reaching the API.
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Only if you want TLS termination at the ingress (recommended):
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx # TODO: change to match your controller
  tls:
    # TODO: provision this secret (e.g. cert-manager / cluster-issuer) and
    # set the real hostname. Remove this block if TLS is terminated elsewhere.
    - hosts:
        - qa-assistant.example.com
      secretName: qa-assistant-tls
  rules:
    - host: qa-assistant.example.com # TODO: replace with your real hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qa-assistant
                port:
                  name: http
