[theme]
# ---- Core colours (light mode only) ----
primaryColor = "#171717"          # primary text
backgroundColor = "#FAFAF8"       # page background
secondaryBackgroundColor = "#FFFFFF"  # cards / panels
textColor = "#6B7280"             # secondary / muted text
font = "sans serif"

# ---- Button / interaction colours ----
# We keep accents black; hover uses a very light gray.
[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false