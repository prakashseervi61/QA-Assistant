server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reject oversized uploads at the proxy, before the body is transferred.
    # nginx's default is 1 MB, which silently disagreed with the app's
    # MAX_FILE_SIZE_MB. Keep these two in step.
    client_max_body_size 50m;

    # Baseline response hardening.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Proxy API requests to the backend container (SSE-friendly: no buffering, long timeout)
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
