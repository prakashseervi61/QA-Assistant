name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin ruff so a new release can't turn a green main red without a code change.
  RUFF_VERSION: "0.14.5"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — gitleaks scans the whole history, and a shallow clone
      # would only show the tip commit. A leaked key in an old commit is exactly
      # the case this is meant to catch, so the full history is required.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
        # `fail` rather than `notify`: a credential in history is unrecoverable
        # once pushed, so it has to block the merge rather than raise a PR comment.
        #
        # This duplicates the pre-commit hook on purpose. The hook is the fast
        # local gate; this is the one that still runs for someone who never
        # installed it, and for a secret committed from a machine where the hook
        # was bypassed with --no-verify.

  quality:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install "ruff==$RUFF_VERSION"

      - name: Ruff lint
        run: ruff check src/ eval/ tests/

      - name: Ruff format check
        run: ruff format --check src/ eval/ tests/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short -q

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/presentation/react/package-lock.json

      - name: Install dependencies
        working-directory: src/presentation/react
        run: npm ci

      - name: Unit tests
        working-directory: src/presentation/react
        run: npm test

      - name: Production build
        working-directory: src/presentation/react
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        # Both projects run everywhere: desktop covers the icon rail, mobile
        # covers the drawer. A change that leaves the phone with no navigation
        # still looks perfect at 1440px, so one profile is not enough.
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/presentation/react/package-lock.json

      - name: Install dependencies
        working-directory: src/presentation/react
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/presentation/react/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: src/presentation/react
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        working-directory: src/presentation/react
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: src/presentation/react/playwright-report/
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: qa-assistant-api:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          tags: qa-assistant-frontend:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
