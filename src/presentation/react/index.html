<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23FFE600' stroke='%230A0A0A' stroke-width='2.5'/%3E%3Cpath d='M5 4h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H5z' fill='%230A0A0A'/%3E%3Cpath d='M19 4h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z' fill='%230A0A0A'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marginalia — Notes &amp; Answers From Your Documents</title>
    <!-- Set the persisted theme before first paint to prevent a flash.
         Light (paper beige) is the default canvas; dark is the opt-in
         black/white inversion. Both are flat and fully brutalist. -->
    <script>
      try {
        if (localStorage.getItem('marginalia_theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {}
    </script>
    <!-- Space Grotesk (display) + JetBrains Mono (labels, code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="h-full antialiased"
    style="background-color: var(--bg-paper); color: var(--ink-primary)"
  >
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
